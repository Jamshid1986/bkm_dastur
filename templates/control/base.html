{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
    <title>{% block title %} {% endblock title %}</title>
    <style>
        .navbar-nav a {
            border-bottom: 2px solid transparent;
        }
        .navbar-nav .current {
            border-bottom: 2px solid #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">BKM</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link {% if request.path == '/' %} current {% endif %}" aria-current="page" href="{% url 'control_index' %}">Session</a>
              <a class="nav-link {% if request.path == '/search/' %} current {% endif %}" href="{% url 'control_search' %}">Izlash</a>
              {% if request.user.last_name == '100' %}
              <a class="nav-link {% if request.path == '/personal/' %} current {% endif %}" href="{% url 'control_personal' %}">Personallar</a>
              <a class="nav-link {% if request.path == '/dastur/' %} current {% endif %}" href="{% url 'control_dastur' %}">Dasturlar</a>
              <a class="nav-link {% if request.path == '/company/' %} current {% endif %}" href="{% url 'control_company' %}">Shirkatlar</a>
              <a class="nav-link {% if request.path == '/country/' %} current {% endif %}" href="{% url 'control_country' %}">Davlatlar</a>
              <a class="nav-link {% if request.path == '/vehicle/' %} current {% endif %}" aria-current="page" href="{% url 'control_vehicle' %}">Avtoulovlar</a>
              <a class="nav-link {% if request.path == '/user/' %} current {% endif %}" href="{% url 'control_user' %}">Foydalanuvchilar</a>
              {% endif %}
              <a class="nav-link" href="{% url 'login_logout' %}">Chiqish</a>
            </div>
          </div>
        </div>
    </nav>
    {% block content %}


    {% endblock content %}
    <script src="{% static 'bootstrap.min.js' %}"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script> -->
</body>
</html>
